/* Layout: 관리 화면 = 상단 상태 → 레인 타임라인 + 우측 관리 패널 → 수치 블록 / 보고 화면 = 한 장 요약 문서 */
:root{
  color-scheme:light;
  --navy:#16365D;--navy8:#234770;--navy7:#315A88;--blue:#3568C5;--blue7:#2959AF;--blue5:#4D7FD8;--blue3:#A4C4EF;--blue2:#D2E2F7;--blue1:#EAF2FC;--blue05:#F5F8FD;--white:#FFFFFF;
  --slate:#5E7694;--slate6:#4E6380;--slate3:#B3C2D4;--cyan:#087F95;--cyan1:#DFF7FB;--violet:#6D5CCE;--violet1:#EEEAFE;
  --red:#C83543;--red1:#FFF2F3;--amber:#805400;--amber1:#FFF0C7;--amberline:#D99A1E;--green:#147447;--green1:#E9F7EF;--accent:#E8590C;
  --shell:linear-gradient(135deg,#E4F0FF,#F3F8FF);--band:linear-gradient(100deg,#315A88,#16365D);--primary:linear-gradient(110deg,#2870ED,#1D5ED8);
  --shadow:0 4px 16px rgb(22 54 93 / 8%);--shadow-f:0 12px 32px rgb(22 54 93 / 14%);
  --r-ctl:12px;--r-card:16px;--r-panel:20px;
  --font:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{background:#EAF2FC}
body{margin:0;font-family:var(--font);color:var(--navy);background:var(--shell);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:2200px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
/* header */
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--navy);display:grid;place-items:center;flex:none}
.tag-proto{border:1px solid var(--blue2);background:var(--white);border-radius:8px;padding:1px 8px;color:var(--blue);font-weight:700;font-size:12px}
.seg{display:inline-flex;background:var(--white);border:1px solid var(--blue2);border-radius:var(--r-ctl);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:9px;font-weight:600;color:var(--slate6);font-size:13px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--blue);color:var(--white);box-shadow:0 2px 6px rgb(53 104 197/.35)}
.seg.dark button[aria-pressed=true]{background:var(--navy)}
.doc-title{flex:1 1 360px;min-width:0;background:var(--white);border:1px solid var(--blue2);border-radius:var(--r-ctl);height:40px;display:flex;align-items:center;padding:0 12px;gap:10px}
.doc-title input{border:0;outline:0;font-size:16px;font-weight:700;flex:1;min-width:0;background:none}
.doc-title small{font-size:12px;color:var(--slate);white-space:nowrap}
.btn{height:36px;border-radius:var(--r-ctl);border:1px solid var(--blue2);background:var(--white);padding:0 13px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--navy);white-space:nowrap}
.btn:hover{border-color:var(--blue3);background:var(--blue05)}
.btn.p{background:var(--primary);color:var(--white);border:0}
.btn.p:hover{filter:brightness(1.05)}
.btn.sm{height:30px;padding:0 10px;font-size:12px;border-radius:10px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.toolbar{background:var(--white);border:1px solid var(--blue2);border-radius:var(--r-card);min-height:52px;display:flex;align-items:center;padding:8px 12px;gap:6px;flex-wrap:wrap}
.tlabel{font-size:11px;color:var(--blue);font-weight:700;margin:0 3px 0 6px;letter-spacing:.02em}
.chip{height:32px;border-radius:var(--r-ctl);border:1px solid var(--blue2);padding:0 11px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--navy);background:var(--white);white-space:nowrap}
.chip:hover{background:var(--blue05)}
.chip[aria-pressed=true]{background:var(--blue1);border-color:var(--blue3);color:var(--blue)}
.chip[aria-pressed=false].area{color:var(--slate);opacity:.7}
.sep{width:1px;height:24px;background:var(--blue2);margin:0 4px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.card{background:var(--white);border:1px solid var(--blue2);border-radius:var(--r-card);box-shadow:var(--shadow);min-width:0}
.pill{border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;line-height:1.5}
/* summary row */
.sumrow{display:grid;grid-template-columns:minmax(260px,1.2fr) repeat(3,minmax(160px,1fr)) minmax(420px,2.3fr);gap:12px}
.verdict{background:var(--band);color:var(--white);border:0;padding:14px 18px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.verdict .d{font-size:12px;opacity:.75}
.verdict .big{font-size:19px;font-weight:800;line-height:1.3;text-wrap:balance}
.row-wrap{display:flex;gap:6px;flex-wrap:wrap}
.kpi{padding:13px 16px}
.kpi h5{margin:0;font-size:12px;color:var(--slate6);font-weight:600}
.kpi b{display:block;font-size:30px;line-height:40px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b em{font-style:normal;font-size:14px;font-weight:700;margin-left:6px}
.kpi p{margin:0;font-size:11.5px;color:var(--slate)}
.meter{height:6px;border-radius:6px;background:var(--blue1);margin-top:8px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.gates{padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gate{border:1px solid var(--blue2);border-radius:var(--r-ctl);padding:9px 11px;background:var(--blue05);min-width:0}
.gate h6{margin:0;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.gate p{margin:4px 0 0;font-size:11.5px;color:var(--slate6)}
.steps{display:flex;gap:4px;margin-top:8px}
.steps button{flex:1;min-width:0;min-height:24px;border-radius:7px;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:1px solid transparent;padding:2px 3px;line-height:1.2;text-align:center;word-break:keep-all}
.st-done{background:var(--green1);color:var(--green)}
.st-current{background:var(--blue);color:var(--white)}
.st-todo{background:var(--white);border:1px dashed var(--blue3)!important;color:var(--slate)}
.st-fail{background:var(--red1);color:var(--red)}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;align-items:start}
.tlcard{overflow:hidden}
.tlhead{display:flex;align-items:center;justify-content:space-between;padding:11px 16px 9px;gap:12px;flex-wrap:wrap}
.tlhead h3{margin:0;font-size:15.5px;font-weight:800}
.tlhead .sub{font-size:12px;color:var(--slate);font-weight:500;margin-left:8px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--slate6);align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.tlscroll{overflow-x:auto;overflow-y:hidden;position:relative}
.grid{position:relative}
.lane-label{position:absolute;left:0;border-right:1px solid var(--blue2);padding:11px 10px 0 13px;z-index:12}
.lane-label b{font-size:12.8px}
.it{position:absolute;z-index:5;cursor:pointer;transition:box-shadow .12s,outline-color .12s}
.it:hover{box-shadow:var(--shadow-f)}
.it.sel{outline:2px solid var(--blue);outline-offset:2px;z-index:9}
.ev{background:var(--white);border:1px solid var(--blue2);border-left-width:4px;border-radius:9px;padding:5px 8px 6px;box-shadow:0 2px 8px rgb(22 54 93/.08)}
.ev.plan{border-style:dashed;border-left-style:solid}
.ev .dl{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;flex-wrap:wrap}
.ev .ti{font-size:11.8px;font-weight:700;line-height:1.3;margin-top:1px}
.ev .bd{font-size:10.8px;color:var(--slate6);line-height:1.35;margin-top:2px}
.ev.corr{opacity:.8}
.ev.corr .ti{text-decoration:line-through;text-decoration-color:var(--red);color:var(--slate6)}
.pin{position:absolute;top:-6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--white);box-shadow:0 0 0 1px currentColor}
.bar{border-radius:8px;padding:6px 10px;font-size:11.8px;font-weight:700;line-height:1.3;display:flex;align-items:center;gap:6px}
.gt{background:var(--white);border:1.5px solid var(--navy);border-radius:10px;padding:6px 8px;font-size:10.8px;line-height:1.3;box-shadow:0 2px 8px rgb(22 54 93/.1)}
.gt .o{margin-top:4px;padding:3px 6px;border-radius:6px;font-weight:700}
.dim{opacity:.28}
.ptabs{display:flex;border-bottom:1px solid var(--blue2)}
.ptabs button{flex:1;border:0;background:none;padding:11px 0;font-size:12.5px;font-weight:700;color:var(--slate)}
.ptabs button[aria-selected=true]{color:var(--blue);box-shadow:inset 0 -2px 0 var(--blue)}
.pbody{padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 140px);overflow:auto}
.blk{border:1px solid var(--blue2);border-radius:var(--r-ctl);padding:9px 10px;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:3px 8px;align-items:start;background:var(--white);cursor:pointer}
.blk:hover{border-color:var(--blue3)}
.blk.focus{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue1)}
.blk.done{opacity:.55}
.blk .no{width:24px;height:24px;border-radius:8px;color:var(--white);font-weight:800;display:grid;place-items:center;font-size:12px}

<script id="sample-text" type="text/plain">27CY SU#2 2차 DVT 진입과 관련하여, 현재까지 확인된 주요 이슈와 테스트 환경 구성 현황, GS(Global South) 및 e-Care 영역별 테스트 수행 가능 범위를 공유드립니다.
현재 2차 DVT는 Global South의 DCM ADF 수행 오류와 e-Care의 VDP API 인증 문제 등 주요 연계 환경의 정상화가 필요한 상황입니다.
특히 1차 DVT에서 수행하지 못했던 N/T 및 Fail 항목에 대한 재검증을 진행하기 위해서는 관련 선행 조건의 해결이 필요하며, 해당 문제의 해결 여부에 따라 2차 DVT의 실제 테스트 수행 범위와 결과가 크게 달라질 것으로 판단됩니다.
이에 따라 현재 진행 상황 및 향후 대응 계획을 아래와 같이 정리하였습니다.
1. 2차 DVT 주요 현황 요약
■ 주요 현황
Global South: 기존 DCM 2대 모두 ADF 수행 오류로 사용 불가. LGE 변경 및 대체 시료 2대 확보 진행 중
e-Care VDP: 신규 전달받은 서버 3개 모두 TCP 연결 정상 확인. 다만 getAllDtc API 호출 시 인증 오류 발생
DMS: 총 24개 API 대상 테스트 예정. 1차 DVT에서 수행하지 못한 DMS 연동 시나리오를 2차 DVT에 포함
e-Care CCW: CTI 내선번호 및 CAN Configuration 파일 미확보로 전체 236건 테스트 불가
e-Care OPW: DMS 연동 필요 23건 수행 불가, 에뮬레이터 기반 제한적 검증 가능 142건
Global South HU/DK: HU 환경 및 DK 서버 연동 등 별도 테스트 환경 구성 필요
■ QA 기준 테스트 수행 가능 범위
구분	전체 TC	수행 불가(N/T)	제한적 수행 가능	기타 TC
Global South	326	84	-	242
e-Care CCW	236	236	-	0
e-Care OPW	292	23	142	127
합계	854	343	142	369
※ QA에서 사전 분류한 테스트 수행 가능 여부 기준이며, 실제 테스트 수행 결과(Pass/Fail)를 의미하지 않습니다.
※ 기타 TC는 N/T 또는 제한적 수행 가능으로 별도 분류되지 않은 항목입니다.
※ GS N/T 84건에는 중복 2건 표기가 있으며, 상세 사유별 집계와의 정합성 확인이 필요합니다.
현재 QA에서 분류한 전체 854건 중 343건(40.2%)이 수행 불가로 확인되었으며, 142건(16.6%)은 제한적인 환경에서 테스트가 가능한 것으로 분류되었습니다.
따라서 주요 선행 조건이 해소되지 않을 경우 2차 DVT에서도 상당수의 N/T 항목이 유지될 것으로 예상됩니다.
2. Global South – DCM ADF 수행 오류 및 대체 DCM 확보 현황
2.1 기존 보유 DCM 현황
현재 27CY SU#2 CV 테스트를 위해 보유하고 있는 DCM은 총 2대이며, 모두 ADF가 정상적으로 수행되지 않아 테스트에 활용할 수 없는 상황입니다.
① 기존 1A용 DCM → 27CY SU#2 CV용 변경 단말
기존 1A용 DCM의 디버그 모드가 활성화되어 있어 CV용 펌웨어로 직접 업데이트하여 사용
펌웨어 변경 이후 ADF 정상 수행 불가
10월 19일 LGE 확인 결과, 1A용 DCM과 CV용 DCM의 SIM 사양이 상이하여 단순 펌웨어 변경만으로는 CV용으로 사용할 수 없다는 답변을 받음
이에 따라 해당 DCM은 현재 구성으로 CV용 테스트 진행 불가
② 기존 24DCM CV용 → 27CY SU#2 CV용 변경 단말
기존 24DCM CV용 DCM의 펌웨어를 27CY SU#2 CV용으로 업데이트
펌웨어 변경 이후 ADF 수행 실패
현재 인증서 문제로 추정하고 있음
기존 DCM에는 24DCM OneServer 접속용 Root CA 인증서가 설치되어 있으며, 해당 인증서를 이용한 ACOS 접속 과정에서 인증서 검증이 정상적으로 이루어지지 않은 것으로 판단
ACOS 접속용 Root CA 인증서 및 인증서 체인 구성에 대한 확인 필요
현재 해당 단말의 인증서 문제는 추정 원인으로, 정확한 오류 원인 및 조치 사항에 대해서는 추가 확인이 필요합니다.
2.2 LGE 대체 DCM 확보 현황
기존에 별도로 확보한 1A용 DCM 2대는 디버그 모드가 활성화되어 있지 않아 당사에서 직접 펌웨어 변경이 불가능하였습니다.
이에 따라 LGE 측으로 해당 DCM 2대의 27CY SU#2 CV용 변경을 요청하였으며, LGE에서는 해당 단말의 CV용 변경이 가능한 것으로 인지하고 있습니다.
LGE 작업 결과는 다음과 같습니다.
구분	작업 내용	현재 상태
DCM #1	당사에서 전달한 기존 시료를 CV용으로 변경	변경 후 반환
DCM #2	LGE 작업 과정에서 당사 시료 파손	LGE 보유 시료로 대체 제공
10월 20일 기준 전달 현황
해당 DCM 2대가 LG U+ 박준현 책임에게 전달됨
LG U+ 김창목 책임을 통해 DasanDMC로 퀵배송 진행 예정
DCM 수령 후 펌웨어 및 통신 환경 확인
ACOS 연동 및 ADF 정상 수행 여부 검증 예정
2.3 ADF 수행 결과에 따른 2차 DVT 영향
① ADF 정상 수행 시
금일 전달되는 DCM에서 ADF가 정상적으로 수행될 경우, 1차 DVT에서 DCM 환경 문제로 Block되었던 Global South 관련 N/T 및 Fail 항목 대부분에 대한 재검증이 가능할 것으로 판단됩니다.
특히 ADF 선행 작업이 필요한 50건에 대해 테스트 가능 여부를 재확인할 수 있으며, DCM을 활용한 REST/MQTT 및 차량 기반 업무 Flow 검증도 진행할 수 있을 것으로 예상됩니다.
다만 HU 환경, DK 서버 연동 등 별도 선행 조건이 필요한 항목은 해당 환경이 추가로 확보되어야 합니다.
② ADF 수행 실패 시
반면 전달받은 DCM 2대 모두 ADF 수행에 실패할 경우, 현재와 동일하게 DCM 기반 테스트 환경을 확보하지 못하게 됩니다.
이에 따라 1차 DVT에서 Block되었던 DCM 연계 N/T 항목은 2차 DVT에서도 테스트가 제한되며, 관련 Fail 항목의 재검증 또한 어려울 것으로 예상됩니다.
결과적으로 DCM의 ADF 문제가 해결되지 않을 경우 Global South의 2차 DVT 결과는 1차 DVT와 비교하여 유의미한 차이가 발생하지 않을 가능성이 높습니다.
따라서 대체 DCM의 ADF 정상 수행 여부를 최우선으로 확인하고, 그 결과에 따라 Global South의 2차 DVT 테스트 수행 범위를 확정할 예정입니다.
3. e-Care – VDP 연동 환경 및 API 인증 오류
3.1 VDP 연동 환경 구성 경과
VDP 연동과 관련하여 9월 30일부터 일본 측과 서버 접속 정보 및 API 인증 방식에 대한 협의를 진행하였으나, 접속 대상에 대한 안내 변경과 인증 방식 확인 지연으로 실제 API 연동 검증이 완료되지 못한 상황입니다.
주요 경과는 다음과 같습니다.
일자	주요 내용	확인 결과
9/30	LG U+ 이준제 책임이 일본 측에 TMKR TSP(VEP) 서버 주소·IP 및 수신용 x-api-key 전달. All DTC/SSR Center Request 호출용 인증 정보 문의	한국 측 정보 전달 완료, 일본 측 호출용 키 미수신

3.2 현재 VDP 연동 상태
10월 20일 기준으로 새로 전달받은 VDP 서버 3개에 대한 TCP 연결은 모두 정상적으로 확인되었습니다.
따라서 기존에 제공받았던 접속 대상에서 발생한 네트워크 연결 문제는 신규 접속 정보 기준으로 해소된 것으로 판단됩니다.
다만 실제 API 통신 여부를 확인하기 위해 getAllDtc를 호출하였으나 인증 오류가 발생하여 정상적인 API 응답을 수신하지 못하였습니다.

3.4 2차 DVT 영향
VDP는 e-Care 서비스의 주요 연계 시스템으로, 관련 API가 정상적으로 동작하지 않을 경우 VDP/VEP 연계 및 관련 업무 Flow에 대한 E2E 검증이 제한됩니다.
또한 2차 DVT에서는 1차 DVT에서 진행하지 못한 DMS 연동 시나리오까지 검증할 예정이므로, VDP 연계가 필요한 테스트 항목은 API 정상 동작 여부가 선행 조건입니다.
현재 TCP 연결까지는 확인되었으나 실제 API 호출이 정상적으로 수행되지 않고 있어, 관련 테스트 진행이 제한되는 상황입니다.
따라서 일본 측의 API 인증 정책 확인 및 오류 해결이 2차 DVT의 e-Care 연계 검증을 위한 주요 선행 조건으로 판단됩니다.
4. DMS 인터페이스 테스트 계획
4.1 테스트 대상 및 범위
2차 DVT에서는 DMS 인터페이스 총 24개 API에 대한 테스트를 진행할 예정입니다.
기존 1차 DVT에서 진행하지 못했던 DMS 연동 항목까지 포함하여 테스트 범위를 확대할 계획입니다.
주요 테스트 범위
DMS 연동 API 24개에 대한 요청/응답 검증
인터페이스별 데이터 정합성 확인
1차 DVT 미수행 DMS 연동 항목 테스트
DMS와 관련 시스템 간 업무 Flow 검증
VDP 연계가 필요한 항목에 대한 E2E 검증
4.2 테스트 선행 조건
DMS API 단위 테스트와 전체 업무 Flow에 대한 E2E 검증은 구분하여 진행할 예정입니다.
특히 VDP와 연계되는 업무 시나리오는 VDP API가 정상적으로 동작해야 실제 E2E 테스트 수행이 가능합니다.
따라서 현재 발생 중인 VDP 인증 오류가 해결되지 않을 경우, DMS 연동 테스트 중 일부 항목의 검증 범위가 제한될 수 있습니다.
이에 따라 DMS 테스트는 API 단위 검증이 가능한 항목부터 진행하고, VDP 연계가 필요한 항목은 관련 환경 정상화 이후 진행하는 방향으로 검토할 예정입니다.

8. 종합 의견
현재 2차 DVT는 1차 DVT에서 수행하지 못한 항목에 대한 재검증과 시스템 간 E2E 테스트 확대를 목표로 진행하고 있으나, 주요 연계 환경이 완전히 확보되지 않아 테스트 수행 범위에 제약이 있는 상황입니다.
특히 다음 사항이 중요하다고 판단됩니다.
첫째, Global South의 DCM ADF 정상 수행 여부입니다.
금일 확보하는 대체 DCM에서 ADF가 정상적으로 수행될 경우 1차 DVT에서 Block되었던 DCM 연계 N/T 및 Fail 항목 대부분에 대한 재검증이 가능할 것으로 판단됩니다.
반면 2대 모두 ADF 수행에 실패할 경우 기존과 동일한 환경 제약이 지속되어, 2차 DVT의 Global South 검증 결과는 1차 DVT와 큰 차이가 없을 것으로 예상됩니다.
둘째, e-Care의 VDP API 인증 문제입니다.
VDP는 9월 30일부터 일본 측과 접속 정보 및 인증 방식에 대한 협의를 진행하였으나, 접속 대상 안내 변경과 인증 방식 확인 지연으로 10월 20일 현재까지 실제 API 연동 검증이 완료되지 못하였습니다.
현재 네트워크 연결은 정상적으로 확인되었으나 API 인증 오류가 해결되지 않아 관련 E2E 테스트가 제한되고 있습니다.
셋째, CCW 및 기타 테스트 환경 확보입니다.
QA 검토 결과 e-Care CCW는 236건 전체가 테스트 수행 불가 상태이며, Global South의 HU 환경 및 DK 서버 연동 등 별도 선행 조건이 필요한 항목도 존재합니다.
따라서 DCM 및 VDP 문제가 해결되더라도 CCW, HU, DK 등 개별 환경 제약 사항은 별도로 해소되어야 합니다.
결론적으로, 현재의 주요 Blocker가 해결되지 않은 상태에서 2차 DVT를 진행할 경우 1차 DVT와 유사한 N/T 및 Fail 결과가 반복될 가능성이 있습니다.
이에 따라 테스트 자체의 진행 여부보다는, 실제 검증이 가능한 환경을 확보하고 선행 조건이 해결된 항목을 중심으로 테스트를 진행하는 것이 필요하다고 판단됩니다.
우선 DCM ADF 및 VDP API 정상 동작 여부를 확인하고, CCW와 DMS 등 관련 연계 환경의 확보 일정에 따라 2차 DVT의 최종 수행 가능 범위와 제한 사항을 확정할 예정입니다.
아울러 현재 테스트 수행이 불가능한 항목은 기능 자체의 결함 여부와 테스트 환경 및 선행 조건 미충족에 따른 제약 사항을 구분하여 관리할 필요가 있습니다.
관련 부문에서는 각 선행 조건의 해결 가능 여부와 예상 조치 일정을 확인하여 공유 부탁드립니다.

function log(text) { const now = new Date(); state.doc.log.unshift({ t: now.toISOString(), text }); state.doc.log = state.doc.log.slice(0, 80); }
function commit(text, rerender = true) { if (text) log(text); persist(); if (rerender) render(); }

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return fmtD(d); };
const diffD = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const md = s => s ? `${+s.slice(5, 7)}/${s.slice(8, 10)}` : '';
const WD = '일월화수목금토';
const uid = p => p + Math.random().toString(36).slice(2, 8);
const areaOf = id => state.doc.areas.find(a => a.id === id) || { name: id, color: '#5E7694' };
const laneOf = id => state.doc.lanes.find(l => l.id === id);
const pct = (a, b) => b ? (a / b * 100) : 0;
const LOCK = '<svg width="11" height="12" viewBox="0 0 11 12" aria-hidden="true" style="flex:none"><rect x="1" y="5" width="9" height="6.5" rx="1.5" fill="currentColor"/><path d="M3 5V3.6a2.5 2.5 0 0 1 5 0V5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>';
const DIAMOND = (c = 'var(--navy)', s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 14 14" aria-hidden="true" style="flex:none"><path d="M7 1 13 7 7 13 1 7Z" fill="${c}"/></svg>`;
function toast(msg, action) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast" role="status">${esc(msg)}${action ? `<button id="toast-act">${esc(action.label)}</button>` : ''}</div>`;
  if (action) $('#toast-act').onclick = () => { action.fn(); root.innerHTML = ''; };
  clearTimeout(toast.t); toast.t = setTimeout(() => root.innerHTML = '', action ? 8000 : 2600);
}

/* ================= derived ================= */
function tcTotals() {
  const r = state.doc.tc.rows; const s = k => r.reduce((a, x) => a + (+x[k] || 0), 0);
  return { total: s('total'), nt: s('nt'), limited: s('limited'), other: s('other') };
}
function statusCounts() {
  const c = {}; state.doc.blockers.forEach(b => c[b.status] = (c[b.status] || 0) + 1); return c;
}
function verdict() {
  const c = statusCounts();
  if (c.blocked) return { label: `선행 조건 미충족 · 차단 ${c.blocked}건 해소 필요`, tone: 'fail' };
  if (c.progress || c.ready || c.undecided) return { label: '선행 조건 해소 진행 중', tone: 'warn' };
  return { label: '선행 조건 해소 · 진행 가능', tone: 'ok' };
}
function visibleLanes() { return state.doc.lanes.filter(l => !state.hiddenAreas.includes(l.area)); }
function itemVisible(it) {
  if (!state.showCorrected && it.corrected) return false;
  if (state.hideResolved && it.tone === 'ok') return false;
  return true;
}

/* ================= render: shell ================= */
function render() {
  const d = state.doc, mgr = state.view === 'manage';
  const v = verdict();
  $('#app').innerHTML = `
  <header class="hdr">
    <div class="logo"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg></i>MapStone <span class="tag-proto">프로토타입</span></div>
    <div class="seg" role="group" aria-label="모드"><button id="m-milestone" aria-pressed="false">마일스톤 모드</button><button aria-pressed="true">이슈관리 모드</button></div>
    <div class="doc-title"><input id="doc-title" aria-label="문서 제목" value="${esc(d.meta.title)}"><small>기준일 ${esc(d.meta.asOf)}${d.meta.example ? ' · 예시 데이터' : ''}</small></div>
    <button class="btn" id="open-import"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/><path d="m17 16 3 3-3 3" transform="translate(0 -3)"/></svg>이슈 텍스트 반영</button>
    <div class="seg dark" role="group" aria-label="화면"><button id="v-manage" aria-pressed="${mgr}">관리 화면</button><button id="v-report" aria-pressed="${!mgr}">보고 화면</button></div>
  </header>
  ${mgr ? manageHTML(v) : reportHTML(v)}`;
  bindShell();
  if (mgr) { drawTimeline($('#tl-host'), false); bindManage(); }
  else drawTimeline($('#tl-host'), true);
}
function bindShell() {
  $('#m-milestone').onclick = () => toast('마일스톤 모드는 MapStone 본 앱에서 열립니다. 이 프로토타입은 이슈관리 모드만 동작합니다.');
  $('#v-manage').onclick = () => { state.view = 'manage'; persist(); render(); };
  $('#v-report').onclick = () => { state.view = 'report'; state.sel = null; persist(); render(); window.scrollTo(0, 0); };
  $('#open-import').onclick = openImport;
  $('#doc-title').onchange = e => { state.doc.meta.title = e.target.value; commit('문서 제목 변경', false); };
}

function verdictCard(v) {
  const c = statusCounts();
  const pills = Object.entries(STATUS).filter(([k]) => c[k]).map(([k, [lbl, tone]]) =>
    `<span class="pill" style="background:${tone === 'fail' ? 'var(--red)' : 'rgb(255 255 255/.16)'};color:var(--white)">${lbl} ${c[k]}</span>`).join('');
  return `<div class="card verdict"><div class="d">기준일 ${esc(d8(state.doc.meta.asOf))} · Blocker ${state.doc.blockers.length}건</div><div class="big">${esc(v.label)}</div><div class="row-wrap">${pills}</div></div>`;
}
function d8(s) { const d = parseD(s); return `${s} (${WD[d.getDay()]})`; }
function kpiCards() {
  const t = tcTotals();
  const ntBy = state.doc.tc.rows.filter(r => r.nt).map(r => `${r.name} ${r.nt}`).join(' · ');
  const limBy = state.doc.tc.rows.filter(r => r.limited).map(r => `${r.name} ${r.limited}`).join(' · ');
  return `
  <div class="card kpi"><h5>QA 분류 전체 TC</h5><b>${t.total}</b>
    <div class="meter" style="height:8px"><i style="width:${pct(t.nt, t.total)}%;background:var(--red)"></i><i style="width:${pct(t.limited, t.total)}%;background:var(--amberline)"></i><i style="width:${pct(t.other, t.total)}%;background:var(--blue3)"></i></div>
    <p style="margin-top:6px">${state.doc.tc.rows.map(r => `${esc(r.name)} ${r.total}`).join(' · ')}</p></div>
  <div class="card kpi"><h5 style="color:var(--red)">수행 불가 (N/T)</h5><b style="color:var(--red)">${t.nt}<em>${pct(t.nt, t.total).toFixed(1)}%</em></b><p>${esc(ntBy) || '—'}</p><div class="meter"><i style="width:${pct(t.nt, t.total)}%;background:var(--red)"></i></div></div>
  <div class="card kpi"><h5 style="color:var(--amber)">제한적 수행 가능</h5><b style="color:var(--amber)">${t.limited}<em>${pct(t.limited, t.total).toFixed(1)}%</em></b><p>${esc(limBy) || '—'}</p><div class="meter"><i style="width:${pct(t.limited, t.total)}%;background:var(--amberline)"></i></div></div>`;
}
function gatesHTML(interactive) {
  const g = state.doc.gates;
  if (!g.length) return `<div class="card gates"><div class="empty">결정 게이트가 없습니다</div></div>`;
  return `<div class="card gates">${g.map(x => `<div class="gate"><h6>${DIAMOND()}게이트 ${esc(x.id)} · ${esc(x.name)}</h6><p>${esc(x.desc)}</p>
    <div class="steps">${x.steps.map((s, i) => `<button class="st-${s[1]}" ${interactive ? `data-gate="${esc(x.id)}" data-step="${i}" title="눌러서 단계 상태 변경"` : 'tabindex="-1" style="cursor:default"'}>${s[1] === 'fail' ? '✕ ' : s[1] === 'done' ? '✓ ' : ''}${esc(s[0])}</button>`).join('')}</div></div>`).join('')}</div>`;
}

/* ================= manage view ================= */
function manageHTML(v) {
  const d = state.doc;
  const areas = d.areas.map(a => `<button class="chip area" data-area="${esc(a.id)}" aria-pressed="${!state.hiddenAreas.includes(a.id)}"><i class="sw" style="background:${a.color}"></i>${esc(a.name)}</button>`).join('');
  return `
  <div class="toolbar">
    <span class="tlabel">아이템</span>
    <button class="chip" data-add="event"><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="var(--blue)"/></svg>이벤트</button>
    <button class="chip" data-add="bar"><svg width="14" height="10" aria-hidden="true"><rect x="0" y="1" width="14" height="8" rx="2" fill="var(--red)"/></svg>상태 바</button>
    <button class="chip" data-add="gate">${DIAMOND()}결정 게이트</button>
    <button class="chip" data-add="blocker">＋ Blocker</button>
    <button class="chip" data-add="check">＋ 확인 요청</button>
    <span class="sep"></span>
    <span class="tlabel">보기</span>
    <button class="chip" id="t-deps" aria-pressed="${state.showDeps}">의존선</button>
    <button class="chip" id="t-corr" aria-pressed="${state.showCorrected}">정정 이력</button>
    <button class="chip" id="t-res" aria-pressed="${state.hideResolved}">해결 항목 숨김</button>
    <span class="sep"></span>
    <span class="tlabel">영역</span>${areas}
    <span style="flex:1"></span>
    <button class="chip" id="copy-json" title="현재 문서를 JSON으로 복사">JSON 복사</button>
    <button class="chip" id="reset-doc">예시로 초기화</button>
  </div>
  <div class="sumrow">${verdictCard(v)}${kpiCards()}${gatesHTML(true)}</div>
  <div class="main">
    <section class="card tlcard" aria-label="이슈 타임라인">
      <div class="tlhead"><h3>이슈 타임라인<span class="sub">일 단위 · 영역별 레인 · 오른쪽 칸은 날짜 미정</span></h3>
        <div class="legend">
          ${['ok', 'fail', 'info', 'warn'].map(k => `<span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="5" fill="${TC[k]}"/></svg>${TONES[k]}</span>`).join('')}
          <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="var(--slate)" stroke-width="1.5" stroke-dasharray="2 1.5"/></svg>예정</span>
          <span>${LOCK}선행 조건 대기</span>
          <span><b style="color:var(--amber)">*</b> 날짜 재확인</span>
        </div></div>
      <div class="tlscroll" id="tl-host"></div>
    </section>
    <aside class="card" aria-label="관리 패널">
      <div class="ptabs" role="tablist">
        ${[['blockers', `Blocker (${d.blockers.length})`], ['checks', `확인 요청 (${d.checks.filter(c => c.state !== 'done').length})`], ['props', '속성'], ['log', '변경 이력']].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}</button>`).join('')}
      </div>
      <div class="pbody" id="pbody">${panelHTML()}</div>
    </aside>
  </div>
  <div class="botrow">${tcTableHTML()}${reasonsHTML()}</div>`;
}

function panelHTML() {
  const d = state.doc;
  if (state.tab === 'blockers') {
    const list = [...d.blockers].sort((a, b) => a.priority - b.priority);
    if (!list.length) return `<div class="empty">Blocker가 없습니다. 툴바의 ＋ Blocker로 추가하세요.</div>`;
    return `<div style="font-size:11.5px;color:var(--slate)">카드를 누르면 관련 레인만 강조합니다. 상태는 바로 바꿀 수 있습니다.</div>` + list.map(b => {
      const a = areaOf(b.area), [lbl, tone] = STATUS[b.status] || STATUS.undecided;
      return `<div class="blk ${state.focusLane === b.lane ? 'focus' : ''} ${b.status === 'done' ? 'done' : ''}" data-blk="${esc(b.id)}" tabindex="0">
        <div class="no" style="background:${a.color}">${b.priority}</div>
        <div class="t"><span style="font-size:10.5px;color:${a.color};font-weight:800;margin-right:6px">${esc(b.label || a.name)}</span>${esc(b.title)}</div>
        <div style="display:flex;gap:8px;align-items:center">
          <select class="stsel" data-status="${esc(b.id)}" aria-label="상태" style="background-color:${TBG[tone]};color:${TINK[tone]}">${Object.entries(STATUS).map(([k, [l]]) => `<option value="${k}" ${k === b.status ? 'selected' : ''}>${l}</option>`).join('')}</select>
          <div class="imp" style="color:${tone === 'fail' ? 'var(--red)' : 'var(--navy)'}">${esc(b.impact)}<small>${esc(b.impactLabel)}</small></div></div>
        <div class="m">${esc(b.detail)}</div>
        <div class="o">${(b.owners || []).map(o => `<span class="own">${esc(o)}</span>`).join('')}<span style="flex:1"></span><button class="btn sm ghost" data-edit-blk="${esc(b.id)}">편집</button></div></div>`;
    }).join('');
  }
  if (state.tab === 'checks') {
    const groups = {}; d.checks.forEach(c => (groups[c.group] = groups[c.group] || []).push(c));
    const done = d.checks.filter(c => c.state === 'done').length;
    return `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13.5px">확인 요청 체크리스트</b><span class="pill" style="background:var(--amber1);color:var(--amber)">완료 ${done}/${d.checks.length}</span></div>
    <div style="font-size:11.5px;color:var(--slate)">상자를 누를 때마다 회신 대기 → 회신 받음 → 확인 완료로 바뀝니다.</div>` +
      Object.entries(groups).map(([g, cs]) => `<div class="grp"><span>${esc(g)}</span><span style="color:var(--slate);font-weight:600">${esc(cs[0].party || '')}</span></div>` +
        cs.map(c => `<div class="chk ${c.state === 'done' ? 'done' : ''}"><button class="s-${c.state}" data-chk="${esc(c.id)}" aria-label="${esc(CHECK[c.state])}" title="${esc(CHECK[c.state])}">${c.state === 'done' ? '✓' : c.state === 'answered' ? '…' : ''}</button><span>${esc(c.text)}<small>${esc(CHECK[c.state])}</small></span></div>`).join('')).join('') +
      `<form id="add-check" style="display:flex;flex-direction:column;gap:6px;margin-top:10px;border-top:1px solid var(--blue2);padding-top:10px">
        <div class="frow"><div class="field"><label for="nc-group">그룹</label><input id="nc-group" list="nc-groups" value="${esc(Object.keys(groups)[0] || '확인 요청')}"><datalist id="nc-groups">${Object.keys(groups).map(g => `<option value="${esc(g)}">`).join('')}</datalist></div>
        <div class="field"><label for="nc-party">상대 부문</label><input id="nc-party" value="${esc((d.checks[0] || {}).party || '')}"></div></div>
        <div class="field"><label for="nc-text">질의 내용</label><input id="nc-text" placeholder="예: 인증 오류 로그 공유 요청"></div>
        <button class="btn sm p" type="submit" style="align-self:flex-end">확인 요청 추가</button></form>`;
  }
  if (state.tab === 'log') {
    if (!d.log.length) return `<div class="empty">아직 변경 이력이 없습니다</div>`;
    return `<div class="loglist">${d.log.map(l => { const t = new Date(l.t); return `<div><time>${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}</time><span>${esc(l.text)}</span></div>`; }).join('')}</div>`;
  }
  return propsHTML();
}

function laneOptions(sel) { return state.doc.lanes.map(l => `<option value="${esc(l.id)}" ${l.id === sel ? 'selected' : ''}>${esc(l.name)}</option>`).join(''); }
function propsHTML() {
  const s = state.sel;
  if (!s) return `<div class="empty">타임라인의 카드·바·게이트를 누르면<br>여기서 날짜·상태·내용을 고칠 수 있습니다.</div>`;
  if (s.kind === 'blocker') {
    const b = state.doc.blockers.find(x => x.id === s.id); if (!b) return '';
    return `<b style="font-size:13.5px">Blocker 편집</b>
    <div class="frow"><div class="field"><label for="p-priority">우선순위</label><input id="p-priority" type="number" min="1" value="${b.priority}" data-bf="priority"></div>
    <div class="field"><label for="p-label">구분</label><input id="p-label" value="${esc(b.label)}" data-bf="label"></div></div>
    <div class="field"><label for="p-btitle">이슈</label><input id="p-btitle" value="${esc(b.title)}" data-bf="title"></div>
    <div class="field"><label for="p-bdetail">대응 내용</label><textarea id="p-bdetail" data-bf="detail">${esc(b.detail)}</textarea></div>
    <div class="frow"><div class="field"><label for="p-impact">영향 수치</label><input id="p-impact" value="${esc(b.impact)}" data-bf="impact"></div>
    <div class="field"><label for="p-implabel">영향 단위</label><input id="p-implabel" value="${esc(b.impactLabel)}" data-bf="impactLabel"></div></div>
    <div class="field"><label for="p-owners">관련 부문 (쉼표로 구분)</label><input id="p-owners" value="${esc((b.owners || []).join(', '))}" data-bf="owners"></div>
    <div class="frow"><div class="field"><label for="p-blane">레인</label><select id="p-blane" data-bf="lane">${laneOptions(b.lane)}</select></div>
    <div class="field"><label for="p-bstatus">상태</label><select id="p-bstatus" data-bf="status">${Object.entries(STATUS).map(([k, [l]]) => `<option value="${k}" ${k === b.status ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:4px"><button class="btn sm" data-del="blocker">삭제</button><button class="btn sm" data-tab-go="blockers">Blocker 목록으로</button></div>`;
  }
  const it = state.doc.items.find(x => x.id === s.id); if (!it) return '';
  const typeName = { event: '이벤트', bar: '상태 바', gate: '결정 게이트' }[it.type];
  const dateField = it.type === 'bar'
    ? `<div class="frow"><div class="field"><label for="p-start">시작일</label><input id="p-start" type="date" value="${it.start || ''}" data-f="start"></div>
       <div class="field"><label for="p-end">종료일 (비우면 해소 시점 미정)</label><input id="p-end" type="date" value="${it.end || ''}" data-f="end"></div></div>`
    : `<div class="frow"><div class="field"><label for="p-date">날짜 (비우면 날짜 미정 칸)</label><input id="p-date" type="date" value="${it.date || ''}" data-f="date"></div>
       <div class="field"><label for="p-flag">날짜 표시</label><select id="p-flag" data-f="dateFlag"><option value="">확정</option><option value="*" ${it.dateFlag === '*' ? 'selected' : ''}>* 재확인 필요</option><option value="~" ${it.dateFlag === '~' ? 'selected' : ''}>~ 추정</option></select></div></div>`;
  return `<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13.5px">${typeName} 속성</b><span class="pill" style="background:${TBG[it.tone || 'neutral']};color:${TINK[it.tone || 'neutral']}">${TONES[it.tone || 'neutral']}</span></div>
  <div class="field"><label for="p-title">${it.type === 'gate' ? '게이트 이름' : '제목'}</label><input id="p-title" value="${esc(it.title)}" data-f="title"></div>
  ${it.type === 'event' ? `<div class="field"><label for="p-body">설명</label><textarea id="p-body" data-f="body">${esc(it.body)}</textarea></div>` : ''}
  ${it.type === 'gate' ? `<div class="field"><label for="p-succ">성공 시</label><input id="p-succ" value="${esc(it.success)}" data-f="success"></div><div class="field"><label for="p-fail">실패 시</label><input id="p-fail" value="${esc(it.fail)}" data-f="fail"></div>` : ''}
  ${dateField}

    const rows = rT.rows.filter(r => !/합계|집계/.test(r[cl]));
    const rep = rT.rows.find(r => /집계/.test(r[cl]));
    doc.reasons = { title: (rT.section.replace(/^\d+(\.\d+)*\.?\s*/, '') || 'N/T') + ' N/T 사유', rows: rows.map(r => ({ label: r[cl], count: +r[cc] || 0, action: r[ca] || '', gate: '' })), reported: rep ? +rep[cc] || 0 : 0, note: rep ? (rep[ca] || '') : '' };
  }
  // checks: "확인 필요" section with ①②③
  let inCheck = false, grp = '', party = '';
  lines.forEach(l => {
    if (isHeading(l)) { inCheck = /확인 필요|확인 사항/.test(l); party = (l.match(/(\S+)\s*측/) || [])[1] ? (l.match(/(\S+)\s*측/)[1] + ' 측') : ''; grp = ''; return; }
    if (/^■\s*우선 확인/.test(l)) { inCheck = true; grp = '우선 확인 사항'; party = ''; return; }
    if (!inCheck) return;
    if (isRow(l)) return;
    if (/^[①②③④⑤⑥⑦⑧⑨]/.test(l)) { grp = l; return; }
    if (l.length > 90 || /^(이에|따라|각 항목)/.test(l) || (!grp && /^(현재|다음)/.test(l))) return;
    if (grp) doc.checks.push({ id: 'c' + doc.checks.length, group: grp, party, text: l, state: 'open' });
  });
  // scenarios: ① ... 시 / ② ... 시
  const scenIdx = lines.findIndex(l => /^①.+시$/.test(l));
  if (scenIdx >= 0) {
    const s2 = lines.findIndex((l, i) => i > scenIdx && /^②.+시$/.test(l));
    const collect = (a, b) => lines.slice(a + 1, b).join(' ').split(/(?<=[다요])\.\s*/).map(s => s.trim()).filter(s => s.length > 6).slice(0, 4);
    let endIdx = s2 + 1; while (endIdx < lines.length && !isHeading(lines[endIdx])) endIdx++;
    if (s2 > 0) {
      const head = lines.slice(0, scenIdx).reverse().find(isHeading) || '';
      const gid = 'A';
      doc.scenarios.push({ gate: gid, title: head.replace(/^\d+(\.\d+)*\.?\s*/, ''), success: { title: lines[scenIdx].replace(/^①\s*/, '').replace(/\s*시$/, ''), points: collect(scenIdx, s2), remain: '' }, fail: { title: lines[s2].replace(/^②\s*/, '').replace(/\s*시$/, ''), points: collect(s2, endIdx), remain: '' }, note: '' });
      const lane = bestLane(head + ' ' + lines[scenIdx]) || doc.lanes[0];
      if (lane) doc.items.push({ id: 'g' + doc.items.length, type: 'gate', lane: lane.id, date: null, gate: gid, title: doc.scenarios[0].success.title.replace(/정상\s*/, '') + ' 게이트', success: short(doc.scenarios[0].success.points[0]), fail: short(doc.scenarios[0].fail.points[0]) });
      doc.gates.push({ id: gid, name: head.replace(/^\d+(\.\d+)*\.?\s*/, '').slice(0, 24), desc: doc.scenarios[0].success.points[0] || '', steps: [['확보', 'current'], ['검증', 'todo'], ['결과', 'todo']] });
    }
  }
  function short(x) { x = String(x || '').replace(/^(반면|특히|다만|이에 따라|결과적으로),?\s*/, ''); const c = x.split(/,\s*/)[0]; return (c.length > 8 && c.length < 70 ? c : x.slice(0, 60) + (x.length > 60 ? '…' : '')); }
  // conclusion: 첫째/둘째/셋째
  lines.forEach((l, i) => { const m = l.match(/^(첫째|둘째|셋째|넷째),?\s*(.+)/); if (m) doc.conclusion.points.push({ title: m[2].replace(/입니다\.?$/, ''), body: lines.slice(i + 1, i + 3).filter(x => !/^(첫째|둘째|셋째|넷째)/.test(x)).join(' ').slice(0, 220) }); });
  const concl = lines.find(l => /^결론적으로/.test(l)); if (concl) doc.conclusion.summary = concl.replace(/^결론적으로,?\s*/, '');
  // link reasons to gate by shared keyword
  if (doc.reasons && doc.scenarios.length) { const gk = tokens(doc.scenarios[0].success.title); doc.reasons.rows.forEach(rw => { if (tokens(rw.label + ' ' + rw.action).some(t => gk.includes(t))) rw.gate = doc.scenarios[0].gate; }); }
  if (!doc.lanes.length) getLane('전체');
  doc.areas.forEach(a => a.id = a.id);
  return doc;
}

/* ================= boot ================= */
render();
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').innerHTML) $('#modal-root').innerHTML = ''; else if (state.sel) { state.sel = null; render(); } } });
</script>
